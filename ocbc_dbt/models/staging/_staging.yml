version: 2

models:
  - name: stg_profile
    description: One row per customer, with income_rank (1 = 'sd. 1 Juta' ... 8 = '>100 Juta').
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_porto
    description: One row per customer x product (snapshot). product and amount are never NULL.
