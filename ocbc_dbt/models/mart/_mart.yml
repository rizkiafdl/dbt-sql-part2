version: 2

models:
  - name: dim_customer
    columns:
      - name: income_rank
        data_tests: [not_null]

  - name: fct_revenue_by_category
    columns:
      - name: product_category
        data_tests: [unique]

  - name: fct_revenue_by_product
    data_tests:
      - unique:
          arguments:
            column_name: "product_category || '|' || product"

  - name: fct_high_income_usage_by_category
    columns:
      - name: product_category
        data_tests: [unique]

  - name: fct_high_income_usage_by_product
    data_tests:
      - unique:
          arguments:
            column_name: "product_category || '|' || product"
